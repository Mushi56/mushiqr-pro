<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient for Squircle Base -->
    <linearGradient id="app-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A26"/>
      <stop offset="100%" stop-color="#0B0D15"/>
    </linearGradient>

    <!-- Classic Red gradient for the ribbon -->
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6A"/>
      <stop offset="50%" stop-color="#EF1E34"/>
      <stop offset="100%" stop-color="#8A0020"/>
    </linearGradient>

    <!-- Glowing effect for the ribbon -->
    <filter id="ribbon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Golden ADMIN Badge Gradient -->
    <linearGradient id="gold-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle Base for App Icon with Golden Admin Stroke -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#app-bg)" stroke="#F59E0B" stroke-width="6"/>

  <!-- QR Code Pattern Modules (Classic White) -->
  <g fill="#FFFFFF" opacity="0.9">
    <!-- Top-Left Finder -->
    <rect x="52" y="52" width="110" height="110" rx="15"/>
    <rect x="68" y="68" width="78" height="78" rx="8" fill="none" stroke="#FFFFFF" stroke-width="11"/>
    <rect x="88" y="88" width="38" height="38" rx="4"/>

    <!-- Top-Right Finder -->
    <rect x="350" y="52" width="110" height="110" rx="15"/>
    <rect x="366" y="68" width="78" height="78" rx="8" fill="none" stroke="#FFFFFF" stroke-width="11"/>
    <rect x="386" y="88" width="38" height="38" rx="4"/>

    <!-- Bottom-Left Finder -->
    <rect x="52" y="350" width="110" height="110" rx="15"/>
    <rect x="68" y="366" width="78" height="78" rx="8" fill="none" stroke="#FFFFFF" stroke-width="11"/>
    <rect x="88" y="386" width="38" height="38" rx="4"/>

    <!-- Data Modules (Scatter) -->
    <rect x="184" y="52" width="22" height="22" rx="4"/>
    <rect x="222" y="52" width="22" height="22" rx="4"/>
    <rect x="260" y="52" width="22" height="22" rx="4"/>
    <rect x="298" y="52" width="22" height="22" rx="4"/>
    
    <rect x="184" y="90" width="22" height="22" rx="4"/>
    <rect x="260" y="90" width="22" height="22" rx="4"/>
    
    <rect x="184" y="128" width="22" height="22" rx="4"/>
    <rect x="222" y="128" width="22" height="22" rx="4"/>
    <rect x="298" y="128" width="22" height="22" rx="4"/>

    <rect x="52" y="184" width="22" height="22" rx="4"/>
    <rect x="52" y="222" width="22" height="22" rx="4"/>
    <rect x="52" y="260" width="22" height="22" rx="4"/>
    <rect x="52" y="298" width="22" height="22" rx="4"/>

    <rect x="350" y="184" width="22" height="22" rx="4"/>
    <rect x="350" y="222" width="22" height="22" rx="4"/>
    <rect x="350" y="260" width="22" height="22" rx="4"/>

    <rect x="438" y="184" width="22" height="22" rx="4"/>
    <rect x="438" y="222" width="22" height="22" rx="4"/>
    <rect x="438" y="260" width="22" height="22" rx="4"/>

    <rect x="184" y="350" width="22" height="22" rx="4"/>
    <rect x="184" y="388" width="22" height="22" rx="4"/>
    <rect x="184" y="426" width="22" height="22" rx="4"/>
  </g>

  <!-- Flowing Classic Red Ribbon "M" -->
  <path d="M 16,270 
           C 110,270 130,115 190,115 
           C 250,115 260,335 310,175 
           C 360,15 410,270 496,270" 
        stroke="url(#ribbon-grad)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#ribbon-glow)"/>

  <!-- Secondary Ribbon Highlight -->
  <path d="M 16,270 
           C 110,270 130,115 190,115 
           C 250,115 260,335 310,175 
           C 360,15 410,270 496,270" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"
        transform="translate(0, -5)"/>

  <!-- Big White "M" Letter -->
  <text x="145" y="385" font-family="'Outfit', Arial, sans-serif" font-weight="900" font-size="260" fill="#FFFFFF" opacity="0.95" style="filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.5))">M</text>

  <!-- Golden ADMIN Shield Badge (Prominent Bottom Right) -->
  <g filter="url(#badge-shadow)">
    <!-- Admin Pill -->
    <rect x="235" y="375" width="240" height="92" rx="26" fill="url(#gold-badge-grad)" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="240" y="380" width="230" height="82" rx="21" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="3"/>
    
    <!-- Shield Icon on Badge -->
    <g transform="translate(254, 396) scale(2.1)" fill="#0F1221">
      <path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3z"/>
    </g>

    <!-- ADMIN Text -->
    <text x="382" y="440" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-weight="900" font-size="38" fill="#0F1221" letter-spacing="4">ADMIN</text>
  </g>
</svg>
