<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.webp" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo.webp" />
    <link rel="apple-touch-icon" sizes="120x120" href="/logo.webp" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#F01A4E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mushi Qr Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Dancing+Script:wght@700&family=Inter:wght@400;600;700&family=Lobster&family=Montserrat:wght@600;700&family=Outfit:wght@400;600;800&family=Oswald:wght@500;700&family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
      body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #030305; /* Match --bg-primary */
        font-family: 'Inter', -apple-system, sans-serif;
      }
      html.native-scanner-active,
      body.native-scanner-active,
      .native-scanner-active body,
      .native-scanner-active html,
      .native-scanner-active #root,
      .native-scanner-active .app,
      .native-scanner-active .app-main-redesigned,
      .native-scanner-active main,
      .native-scanner-active .scanner-page,
      .native-scanner-active .qrs,
      .native-scanner-active .qrs-body,
      .native-scanner-active .qrs-frame,
      .native-scanner-active .qrs-viewport {
        background: transparent !important;
        background-color: transparent !important;
        background-image: none !important;
      }
      html.native-scanner-active #initial-loader,
      body.native-scanner-active #initial-loader,
      .native-scanner-active #initial-loader {
        display: none !important;
      }
      #initial-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background-color: #030305; z-index: 999999;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .loader-logo {
        width: 100px; height: 100px; object-fit: contain; margin-bottom: 24px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: drop-shadow(0 0 30px rgba(214, 0, 54, 0.3));
        border-radius: 22%; /* iPhone squircle */
      }
      .loader-brand {
        font-family: 'Outfit', sans-serif;
        font-size: 32px;
        font-weight: 800;
        color: #fff;
        margin-bottom: 32px;
        letter-spacing: -1px;
      }
      .loader-brand span {
        font-weight: 500;
        background: linear-gradient(135deg, #D60036 0%, #FF007F 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .spinner {
        width: 42px; height: 42px; border: 3px solid rgba(214, 0, 54, 0.1);
        border-radius: 50%; border-top-color: #D60036;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { transform: scale(1.05); } }
    </style>
  </head>
  <body>
    <!-- Persistent Splash Screen -->
    <div id="initial-loader">
      <img src="/logo.webp" alt="App Logo" class="loader-logo" />
      <div class="loader-brand">Mushi QR <span>Pro</span></div>
      <div class="spinner"></div>
    </div>

    <!-- React App Container -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>

    <!-- Splash Screen Logic -->
    <script>
      let initialAction = null;
      try {
        if (window.NativeAndroidApp && typeof window.NativeAndroidApp.getPendingAction === 'function') {
          initialAction = window.NativeAndroidApp.getPendingAction();
          window.INITIAL_ACTION = initialAction;
        }
      } catch(e) {}

      const splash = document.getElementById('initial-loader');
      if (initialAction === 'scan' && splash) {
        splash.style.display = 'none';
      }

      // Wait for everything to load, then wait an extra 2 seconds for a premium feel
      window.addEventListener('load', () => {
        if (initialAction === 'scan') return;
        setTimeout(() => {
          if (splash) {
            splash.style.opacity = '0';
            splash.style.pointerEvents = 'none'; // Instantly allow clicks underneath
            // Remove from DOM after fade transition completes
            setTimeout(() => splash.remove(), 600);
          }
        }, 1000); // 1000ms delay
      });
    </script>
  </body>
</html>
